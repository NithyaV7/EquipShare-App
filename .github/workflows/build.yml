name: Build APK and web app
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate web files
        run: flutter create . --project-name equishare --org lk.equishare --platforms=web
      - name: Remove the default sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter test
      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android files
        run: flutter create . --project-name equishare --org lk.equishare --platforms=android
      - name: Android permissions, minimum version and lint
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application|' $M
          G=$(ls android/app/build.gradle*)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' $G
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' $G
          echo '-dontwarn com.google.mlkit.**' > android/app/proguard-rules.pro
          case "$G" in
            *.kts) R='isMinifyEnabled = false\n            isShrinkResources = false' ;;
            *) R='minifyEnabled false\n            shrinkResources false' ;;
          esac
          sed -i "0,/release {/s//release {\n            proguardFiles(\"proguard-rules.pro\")\n            $R/" $G
          grep -n "uses-permission" $M
          grep -n -B2 -A8 "release {" $G
          grep -n -A4 "^android {" $G
      - name: Remove the default sample test
        run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: equishare-apk
          path: build/app/outputs/flutter-apk/app-release.apk
